version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btg_billing}
      POSTGRES_USER: ${POSTGRES_USER:-btg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btg_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-btg_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-btg_billing}
    networks: [internal]
    volumes:
      - attachments:/app/attachments
    # Run pending migrations, then start the server
    command: >
      sh -c "npx prisma migrate deploy --schema=./prisma/schema.prisma && node server.js"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-btg_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-btg_billing}
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btg_billing}
      POSTGRES_USER: ${POSTGRES_USER:-btg_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/backup.sh:/backup.sh
      - backups:/backups
    networks: [internal]
    entrypoint: ["sh", "-c"]
    # crond-style loop: nightly backup at 2am, keep container alive via sleep loop
    command: >
      "chmod +x /backup.sh && while true; do
        /backup.sh;
        sleep 86400;
      done"

networks:
  internal:

volumes:
  db_data:
  caddy_data:
  caddy_config:
  attachments:
  backups:
